<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Sparkling Drawing Board</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka & Nunito for playful cute look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastelBg: '#FFF5F8',
                        pastelCard: '#FFFFFF',
                        pastelPink: '#FFB7B2',
                        pastelPurple: '#E2F0CB',
                        pastelPurpleAccent: '#D7BCE8',
                        pastelYellow: '#FFE5B4',
                        pastelBlue: '#C7CEEA',
                        pastelMint: '#B5EAD7',
                        cuteText: '#5A4E66'
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        nunito: ['Nunito', 'sans-serif'],
                    },
                    boxShadow: {
                        'cute': '0 10px 25px -5px rgba(230, 180, 205, 0.4), 0 8px 10px -6px rgba(230, 180, 205, 0.2)',
                        'button': '0 4px 0px 0px rgba(220, 160, 190, 0.6)',
                        'button-active': '0 1px 0px 0px rgba(220, 160, 190, 0.6)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFF5F8;
            background-image: radial-gradient(#FDE2E4 1.5px, transparent 1.5px), radial-gradient(#FDE2E4 1.5px, #FFF5F8 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            touch-action: none; /* Prevents scrolling while drawing on mobile */
        }

        /* Bounce & wobble animations for buttons */
        .btn-playful {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease;
        }
        .btn-playful:hover {
            transform: translateY(-2px) scale(1.03);
        }
        .btn-playful:active {
            transform: translateY(2px) scale(0.97);
        }

        /* Custom scrollbar for color palettes */
        .custom-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #FEE2E2;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #FFB7B2;
            border-radius: 10px;
        }

        /* Canvas cursor wrapper */
        .canvas-container {
            position: relative;
            cursor: crosshair;
        }

        /* Color swatch ring when selected */
        .color-swatch {
            transition: all 0.2s ease;
        }
        .color-swatch.active {
            transform: scale(1.25);
            box-shadow: 0 0 0 4px white, 0 0 0 7px #FFB7B2;
        }

        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            background: #FFE5B4;
            height: 10px;
            border-radius: 5px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #FF9AA2;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            border: 2px solid white;
        }

        /* Floating sparkles decorative animation */
        @keyframes floatSparkle {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-8px) rotate(15deg); opacity: 1; }
        }
        .sparkle-icon {
            animation: floatSparkle 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen text-cuteText flex flex-col justify-between p-3 md:p-6 select-none">

    <!-- Header Section -->
    <header class="max-w-6xl w-full mx-auto flex flex-wrap items-center justify-between gap-3 mb-3 bg-white/80 backdrop-blur-md p-4 rounded-3xl shadow-cute border-2 border-pink-100">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-300 via-purple-300 to-indigo-300 flex items-center justify-center text-white text-2xl shadow-inner">
                <i class="fa-solid font-bold fa-wand-magic-sparkles sparkle-icon"></i>
            </div>
            <div>
                <h1 class="font-fredoka text-2xl md:text-3xl font-bold bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 bg-clip-text text-transparent">
                    Doodle Sparkle ✨
                </h1>
                <p class="text-xs md:text-sm font-semibold text-pink-400">Create cute & magical artwork!</p>
            </div>
        </div>

        <!-- Top Quick Actions -->
        <div class="flex items-center gap-2">
            <button id="btnUndo" class="btn-playful px-3 py-2 bg-pink-100 hover:bg-pink-200 text-pink-600 rounded-2xl font-bold text-sm flex items-center gap-1.5 shadow-sm" title="Undo">
                <i class="fa-solid fa-rotate-left"></i> <span class="hidden sm:inline">Undo</span>
            </button>
            <button id="btnRedo" class="btn-playful px-3 py-2 bg-purple-100 hover:bg-purple-200 text-purple-600 rounded-2xl font-bold text-sm flex items-center gap-1.5 shadow-sm" title="Redo">
                <i class="fa-solid fa-rotate-right"></i> <span class="hidden sm:inline">Redo</span>
            </button>
            <button id="btnClear" class="btn-playful px-3 py-2 bg-red-100 hover:bg-red-200 text-red-500 rounded-2xl font-bold text-sm flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Clear</span>
            </button>
            <button id="btnSave" class="btn-playful px-4 py-2 bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white rounded-2xl font-bold text-sm shadow-md flex items-center gap-1.5">
                <i class="fa-solid fa-download"></i> Save
            </button>
            <button id="btnShare" class="btn-playful px-3 py-2 bg-yellow-100 hover:bg-yellow-200 text-amber-600 rounded-2xl font-bold text-sm shadow-sm flex items-center gap-1.5">
                <i class="fa-solid fa-share-nodes"></i> <span class="hidden sm:inline">Share</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <main class="max-w-6xl w-full mx-auto flex-1 flex flex-col md:flex-row gap-4 mb-4">
        
        <!-- Left Toolbar: Tools, Brushes & Sizes -->
        <aside class="w-full md:w-64 bg-white/90 backdrop-blur-md p-4 rounded-3xl shadow-cute border-2 border-pink-100 flex flex-col justify-between gap-4">
            
            <div class="space-y-4">
                <!-- Brush Selection -->
                <div>
                    <h2 class="font-fredoka text-sm uppercase tracking-wider text-purple-400 font-bold mb-2.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-paint-brush"></i> Brushes
                    </h2>
                    <div class="grid grid-cols-2 gap-2">
                        <button data-tool="pen" class="tool-btn btn-playful p-2.5 rounded-2xl border-2 border-pink-100 bg-pink-50 text-pink-600 font-bold text-xs flex flex-col items-center gap-1 hover:border-pink-300 active-tool">
                            <i class="fa-solid fa-pen-nib text-lg"></i>
                            <span>Pen</span>
                        </button>
                        <button data-tool="highlighter" class="tool-btn btn-playful p-2.5 rounded-2xl border-2 border-purple-50 bg-purple-50 text-purple-600 font-bold text-xs flex flex-col items-center gap-1 hover:border-purple-200">
                            <i class="fa-solid fa-highlighter text-lg"></i>
                            <span>Soft Brush</span>
                        </button>
                        <button data-tool="glitter" class="tool-btn btn-playful p-2.5 rounded-2xl border-2 border-amber-50 bg-amber-50 text-amber-600 font-bold text-xs flex flex-col items-center gap-1 hover:border-amber-200 relative overflow-hidden">
                            <i class="fa-solid fa-wand-magic-sparkles text-lg text-amber-500"></i>
                            <span>Glitter Magic</span>
                            <span class="absolute top-0 right-0 bg-pink-400 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded-bl-lg">POP</span>
                        </button>
                        <button data-tool="eraser" class="tool-btn btn-playful p-2.5 rounded-2xl border-2 border-blue-50 bg-blue-50 text-blue-500 font-bold text-xs flex flex-col items-center gap-1 hover:border-blue-200">
                            <i class="fa-solid fa-eraser text-lg"></i>
                            <span>Eraser</span>
                        </button>
                    </div>
                </div>

                <!-- Special Effects & Stamp Brushes -->
                <div>
                    <h2 class="font-fredoka text-sm uppercase tracking-wider text-pink-400 font-bold mb-2.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-icons"></i> Cute Stamps
                    </h2>
                    <div class="grid grid-cols-4 gap-1.5">
                        <button data-stamp="⭐" class="stamp-btn btn-playful p-2 rounded-xl bg-yellow-50 text-lg hover:bg-yellow-100 border border-yellow-200">⭐</button>
                        <button data-stamp="💖" class="stamp-btn btn-playful p-2 rounded-xl bg-pink-50 text-lg hover:bg-pink-100 border border-pink-200">💖</button>
                        <button data-stamp="🌸" class="stamp-btn btn-playful p-2 rounded-xl bg-rose-50 text-lg hover:bg-rose-100 border border-rose-200">🌸</button>
                        <button data-stamp="✨" class="stamp-btn btn-playful p-2 rounded-xl bg-purple-50 text-lg hover:bg-purple-100 border border-purple-200">✨</button>
                    </div>
                </div>

                <!-- Size Adjuster -->
                <div class="bg-pink-50/50 p-3 rounded-2xl border border-pink-100">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-fredoka text-xs font-bold text-pink-500">Brush Size</span>
                        <span id="sizeValue" class="font-mono text-xs font-extrabold text-pink-400 bg-white px-2 py-0.5 rounded-full border border-pink-200">12px</span>
                    </div>
                    <input type="range" id="brushSize" min="2" max="60" value="12" class="w-full accent-pink-400">
                    
                    <!-- Preview Circle -->
                    <div class="mt-3 flex justify-center items-center h-12 bg-white rounded-xl border border-pink-100 overflow-hidden">
                        <div id="brushPreview" class="rounded-full bg-pink-400 transition-all duration-100"></div>
                    </div>
                </div>
            </div>

            <!-- Canvas Background Options -->
            <div>
                <h2 class="font-fredoka text-xs uppercase tracking-wider text-gray-400 font-bold mb-2">Paper Type</h2>
                <div class="flex gap-2">
                    <button data-bg="white" class="bg-btn btn-playful flex-1 py-1.5 rounded-xl border-2 border-gray-200 bg-white text-xs font-bold shadow-sm">Blank</button>
                    <button data-bg="grid" class="bg-btn btn-playful flex-1 py-1.5 rounded-xl border-2 border-purple-100 bg-purple-50 text-xs font-bold text-purple-600">Grid</button>
                    <button data-bg="dots" class="bg-btn btn-playful flex-1 py-1.5 rounded-xl border-2 border-pink-100 bg-pink-50 text-xs font-bold text-pink-600">Dots</button>
                </div>
            </div>

        </aside>

        <!-- Center Canvas Container -->
        <section class="flex-1 bg-white rounded-3xl shadow-cute border-4 border-pink-100 p-2 md:p-4 flex flex-col justify-center items-center relative overflow-hidden min-h-[400px]">
            <div id="canvasWrapper" class="w-full h-full min-h-[380px] rounded-2xl relative overflow-hidden canvas-container bg-white flex items-center justify-center">
                <canvas id="drawingCanvas" class="w-full h-full block rounded-2xl"></canvas>
            </div>
            
            <!-- Floating Toast Notification -->
            <div id="toast" class="absolute top-6 opacity-0 pointer-events-none transition-all duration-300 bg-gray-800/90 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-green-400"></i>
                <span id="toastMsg">Artwork Saved!</span>
            </div>
        </section>

    </main>

    <!-- Bottom Palette Bar -->
    <footer class="max-w-6xl w-full mx-auto bg-white/90 backdrop-blur-md p-3 rounded-3xl shadow-cute border-2 border-pink-100">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <span class="font-fredoka text-xs uppercase text-pink-400 font-bold whitespace-nowrap">Palette:</span>
                <!-- Custom Color Picker -->
                <div class="relative flex items-center">
                    <input type="color" id="customColorPicker" value="#FF6B6B" class="w-9 h-9 rounded-full border-2 border-white shadow-md cursor-pointer opacity-0 absolute inset-0 z-10">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-400 to-purple-400 border-2 border-white shadow-md flex items-center justify-center text-white text-xs">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                </div>
            </div>

            <!-- Color Swatches Horizontal Scroll -->
            <div class="flex items-center gap-2.5 overflow-x-auto w-full custom-scroll py-2 px-1" id="paletteContainer">
                <!-- Swatches injected dynamically by JS for cute soft themes -->
            </div>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        window.onload = function() {
            // Main Canvas Initialization
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            const canvasWrapper = document.getElementById('canvasWrapper');

            // UI Elements
            const brushSizeInput = document.getElementById('brushSize');
            const sizeValueDisplay = document.getElementById('sizeValue');
            const brushPreview = document.getElementById('brushPreview');
            const customColorPicker = document.getElementById('customColorPicker');
            const paletteContainer = document.getElementById('paletteContainer');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');

            // Canvas State Variables
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            let currentTool = 'pen'; // 'pen', 'highlighter', 'glitter', 'eraser', 'stamp'
            let selectedStamp = '⭐';
            let currentColor = '#FF6B6B';
            let currentSize = 12;
            let currentPaperBg = 'white';

            // Undo / Redo History Stack
            const history = [];
            let historyStep = -1;
            const MAX_HISTORY = 25;

            // Cute Vibrant Pastel Color Palette
            const cutePalette = [
                '#FF6B6B', '#FF8E72', '#FFB7B2', '#FFDAC1', 
                '#E2F0CB', '#B5EAD7', '#4EAF98', '#C7CEEA', 
                '#957FEF', '#D7BCE8', '#FF9AA2', '#5A4E66', '#333333'
            ];

            // Render Palette Swatches
            function initPalette() {
                paletteContainer.innerHTML = '';
                cutePalette.forEach((color, index) => {
                    const swatch = document.createElement('button');
                    swatch.className = `color-swatch w-8 h-8 rounded-full border-2 border-white shadow-sm flex-shrink-0 btn-playful ${index === 0 ? 'active' : ''}`;
                    swatch.style.backgroundColor = color;
                    swatch.addEventListener('click', () => {
                        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                        swatch.classList.add('active');
                        currentColor = color;
                        updateBrushPreview();
                    });
                    paletteContainer.appendChild(swatch);
                });
            }

            // Canvas Resizing Function with High DPI support
            function resizeCanvas() {
                const rect = canvasWrapper.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                
                // Save drawing before resize
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, 0);

                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                
                // Restore paper background & artwork
                drawPaperBackground();
                ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
            }

            // Draw Background Patterns (White, Grid, Dots)
            function drawPaperBackground() {
                const width = canvas.width / (window.devicePixelRatio || 1);
                const height = canvas.height / (window.devicePixelRatio || 1);

                ctx.save();
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, width, height);

                if (currentPaperBg === 'grid') {
                    ctx.strokeStyle = '#F3E8FF';
                    ctx.lineWidth = 1;
                    const step = 24;
                    for (let x = 0; x < width; x += step) {
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        ctx.stroke();
                    }
                    for (let y = 0; y < height; y += step) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(width, y);
                        ctx.stroke();
                    }
                } else if (currentPaperBg === 'dots') {
                    ctx.fillStyle = '#FCE7F3';
                    const step = 20;
                    for (let x = 10; x < width; x += step) {
                        for (let y = 10; y < height; y += step) {
                            ctx.beginPath();
                            ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
                ctx.restore();
            }

            // Save Snapshot to History Stack
            function saveState() {
                if (historyStep < history.length - 1) {
                    history.splice(historyStep + 1);
                }
                if (history.length >= MAX_HISTORY) {
                    history.shift();
                }
                history.push(canvas.toDataURL());
                historyStep = history.length - 1;
            }

            // Restore Canvas State
            function restoreState(dataUrl) {
                const img = new Image();
                img.onload = function() {
                    ctx.save();
                    ctx.setTransform(1, 0, 0, 1, 0, 0); // reset transform
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    ctx.restore();
                };
                img.src = dataUrl;
            }

            // Canvas Pointer Coordinates Helper
            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            // Drawing Engine Start
            function startDrawing(e) {
                isDrawing = true;
                const coords = getCoordinates(e);
                lastX = coords.x;
                lastY = coords.y;

                if (currentTool === 'stamp') {
                    placeStamp(coords.x, coords.y);
                    saveState();
                    isDrawing = false;
                    return;
                }

                if (currentTool === 'glitter') {
                    drawGlitterParticles(coords.x, coords.y);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                }
            }

            // Drawing Engine Move
            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const coords = getCoordinates(e);

                ctx.save();

                if (currentTool === 'pen') {
                    ctx.globalAlpha = 1.0;
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = currentSize;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();

                } else if (currentTool === 'highlighter') {
                    ctx.globalAlpha = 0.35;
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = currentSize * 1.8;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();

                } else if (currentTool === 'eraser') {
                    ctx.globalAlpha = 1.0;
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = currentSize * 2;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();

                } else if (currentTool === 'glitter') {
                    drawGlitterParticles(coords.x, coords.y);
                }

                ctx.restore();

                lastX = coords.x;
                lastY = coords.y;
            }

            // Stop Drawing & Save State
            function stopDrawing() {
                if (isDrawing) {
                    isDrawing = false;
                    saveState();
                }
            }

            // Sparkling Glitter Effect Logic
            function drawGlitterParticles(x, y) {
                const count = Math.floor(currentSize / 2) + 4;
                const radius = currentSize * 1.2;

                for (let i = 0; i < count; i++) {
                    const offsetX = (Math.random() - 0.5) * radius * 2;
                    const offsetY = (Math.random() - 0.5) * radius * 2;
                    const particleX = x + offsetX;
                    const particleY = y + offsetY;
                    const pSize = Math.random() * (currentSize / 3) + 2;

                    ctx.save();
                    ctx.fillStyle = Math.random() > 0.3 ? currentColor : '#FFF';
                    ctx.shadowColor = currentColor;
                    ctx.shadowBlur = 8;

                    // Draw tiny diamond sparkle shapes
                    ctx.beginPath();
                    ctx.moveTo(particleX, particleY - pSize);
                    ctx.lineTo(particleX + pSize / 2, particleY);
                    ctx.lineTo(particleX, particleY + pSize);
                    ctx.lineTo(particleX - pSize / 2, particleY);
                    ctx.closePath();
                    ctx.fill();

                    // Tiny shiny stars
                    if (Math.random() > 0.6) {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(particleX, particleY, pSize / 4, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                }
            }

            // Stamp Tool Drawing
            function placeStamp(x, y) {
                ctx.save();
                ctx.font = `${currentSize * 2.5}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(selectedStamp, x, y);
                ctx.restore();
            }

            // Dynamic Brush Size Preview Update
            function updateBrushPreview() {
                sizeValueDisplay.textContent = `${currentSize}px`;
                brushPreview.style.width = `${Math.min(currentSize, 40)}px`;
                brushPreview.style.height = `${Math.min(currentSize, 40)}px`;
                brushPreview.style.backgroundColor = currentTool === 'eraser' ? '#E5E7EB' : currentColor;
            }

            // Toast Message Helper
            function showToast(message) {
                toastMsg.textContent = message;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100');
                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 2200);
            }

            // Attach Event Listeners for Canvas
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);

            // Brush Tools Selection Handler
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tool-btn').forEach(b => {
                        b.classList.remove('active-tool', 'ring-2', 'ring-pink-300', 'bg-pink-100');
                    });
                    document.querySelectorAll('.stamp-btn').forEach(s => s.classList.remove('ring-2', 'ring-pink-400'));
                    
                    btn.classList.add('active-tool', 'ring-2', 'ring-pink-300', 'bg-pink-100');
                    currentTool = btn.dataset.tool;
                    updateBrushPreview();
                });
            });

            // Cute Stamps Selection Handler
            document.querySelectorAll('.stamp-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool', 'ring-2', 'ring-pink-300'));
                    document.querySelectorAll('.stamp-btn').forEach(s => s.classList.remove('ring-2', 'ring-pink-400'));
                    
                    btn.classList.add('ring-2', 'ring-pink-400');
                    currentTool = 'stamp';
                    selectedStamp = btn.dataset.stamp;
                    updateBrushPreview();
                });
            });

            // Brush Size Slider Handler
            brushSizeInput.addEventListener('input', (e) => {
                currentSize = parseInt(e.target.value);
                updateBrushPreview();
            });

            // Custom Color Picker Handler
            customColorPicker.addEventListener('input', (e) => {
                currentColor = e.target.value;
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                updateBrushPreview();
            });

            // Paper Background Selector
            document.querySelectorAll('.bg-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPaperBg = btn.dataset.bg;
                    drawPaperBackground();
                    saveState();
                });
            });

            // Undo Action
            document.getElementById('btnUndo').addEventListener('click', () => {
                if (historyStep > 0) {
                    historyStep--;
                    restoreState(history[historyStep]);
                }
            });

            // Redo Action
            document.getElementById('btnRedo').addEventListener('click', () => {
                if (historyStep < history.length - 1) {
                    historyStep++;
                    restoreState(history[historyStep]);
                }
            });

            // Clear Canvas Action
            document.getElementById('btnClear').addEventListener('click', () => {
                drawPaperBackground();
                saveState();
                showToast('Canvas Cleared! 🧼');
            });

            // Save Image Action (Download PNG)
            document.getElementById('btnSave').addEventListener('click', () => {
                const link = document.createElement('a');
                link.download = `sparkle-drawing-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('Saved to your device! 🎨');
            });

            // Web Share API or Fallback Copy
            document.getElementById('btnShare').addEventListener('click', async () => {
                try {
                    canvas.toBlob(async (blob) => {
                        const file = new File([blob], 'my-cute-doodle.png', { type: 'image/png' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: 'My Cute Drawing ✨',
                                text: 'Check out this cute drawing I made on Doodle Sparkle!',
                                files: [file]
                            });
                        } else {
                            // Fallback message
                            showToast('Downloading image for share... 💌');
                            const link = document.createElement('a');
                            link.download = 'my-cute-doodle.png';
                            link.href = canvas.toDataURL();
                            link.click();
                        }
                    });
                } catch (err) {
                    showToast('Downloaded drawing! ✨');
                }
            });

            // Initialization setup
            initPalette();
            resizeCanvas();
            saveState(); // Initial empty canvas state
            updateBrushPreview();

            // Window resize handler
            window.addEventListener('resize', resizeCanvas);
        };
    </script>
</body>
  </html>
